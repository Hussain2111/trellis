name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trellis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Real service above — migrations and DB-backed tests run against it.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/trellis
      GOOGLE_GENERATIVE_AI_API_KEY: ci-placeholder
      SCRAPE_MODE: fixture
      ALLOW_PAID_PROVIDERS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
