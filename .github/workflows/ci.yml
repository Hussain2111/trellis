name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so env.ts's zod schema parses in CI — no real
      # service is contacted by typecheck/build/lint/test.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/trellis
      GOOGLE_GENERATIVE_AI_API_KEY: ci-placeholder
      SCRAPE_MODE: fixture
      ALLOW_PAID_PROVIDERS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
